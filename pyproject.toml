[project]
name = "voice-language"
version = "0.1.0"
description = "Push-to-talk speech translator built with Flet and OpenAI"
readme = "README.md"
authors = [
    { name = "Tu Nombre", email = "victorcv326@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.5",
    "flet-audio==1.0.5",
    "flet-audio-recorder==1.0.5",
    "openai>=3",
    "platformdirs>=4.13.5",
]

[project.scripts]
voice-language = "voice_language:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
